# Applies the service infrastructure with Terraform.
#  - Pull request: `terraform plan` (for human review).
#  - Push to main (i.e. after the PR is merged): `terraform apply`.
#
# Runs on a SELF-HOSTED runner because the target is a local kind cluster that a
# cloud-hosted runner cannot reach. The runner uses the host's kubeconfig.
name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Serialize runs: the local backend state file has no locking, so overlapping
# applies on the self-hosted runner could corrupt it. Never cancel an in-flight apply.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: services
    # GHCR pull credentials for the ghcr-pull image pull secret (private images).
    # Set GHCR_PULL_USERNAME / GHCR_PULL_TOKEN (read:packages) as repository secrets.
    env:
      TF_VAR_ghcr_username: ${{ secrets.GHCR_PULL_USERNAME }}
      TF_VAR_ghcr_token: ${{ secrets.GHCR_PULL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 to diff which svc-*.tf changed (Atlas infra events)
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init (state persisted outside the runner workdir)
        # The state file lives under $HOME (outside _work), so actions/checkout's
        # clean step cannot delete it between runs. Without this, Terraform starts
        # from an empty state each run and loses track of created resources.
        run: |
          mkdir -p "$HOME/atlas-tfstate"
          terraform init -input=false \
            -backend-config="path=$HOME/atlas-tfstate/terraform.tfstate"
      - name: Plan (pull request)
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -no-color
      - name: Apply (merged to main)
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve -no-color
      - name: Report infra events to Atlas (best-effort)
        # Records infra.applied / infra.destroyed per changed service (ADR atlas-api/0017).
        # The self-hosted runner reaches the local API (default http://localhost:8081);
        # override with the ATLAS_API_URL repo variable. Never fails the apply.
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        env:
          ATLAS_API_URL: ${{ vars.ATLAS_API_URL }}
        run: |
          API="${ATLAS_API_URL:-http://localhost:8081}"
          git rev-parse HEAD~1 >/dev/null 2>&1 || { echo "no previous commit — skipping"; exit 0; }
          git diff --name-status HEAD~1 HEAD -- services/ | while read -r status file; do
            case "$file" in services/svc-*.tf) ;; *) continue ;; esac
            name="$(basename "$file" .tf)"; name="${name#svc-}"
            case "$status" in
              D*) etype="infra.destroyed" ;;
              *)  etype="infra.applied" ;;
            esac
            curl -fsS -X POST "${API}/services/${name}/events" \
              -H 'content-type: application/json' -H 'X-Atlas-Actor: terraform-runner' \
              -d "{\"type\":\"${etype}\",\"detail\":\"terraform ${status}\"}" \
              && echo "reported ${etype} for ${name}" || echo "Atlas API unreachable — skipped ${name}"
          done
