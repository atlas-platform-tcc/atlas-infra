# Cluster local de experimentação do Atlas (ADR atlas-infra/0001 — kind).
# Declarativo e versionado: o cluster inteiro é recriável a partir deste arquivo.
#   kind create cluster --config atlas-infra/kind-config.yaml
#   kind delete cluster --name atlas-local
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: atlas-local
nodes:
  - role: control-plane
    # ingress-ready=true habilita o nó a receber o ingress-nginx (ADR atlas-infra/0007).
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # 80/443 do host -> ingress-nginx: cada serviço é alcançado por seu host
      # (ex.: http://payments-service.127.0.0.1.nip.io) sem port-forward (ADR atlas-templates/0006).
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
